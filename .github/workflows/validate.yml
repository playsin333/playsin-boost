name: Validate package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_release.py
  source:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: '${{ matrix.shell }}'
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated update source resolver
        run: '& tests/UpdateSource.Tests.ps1'
      - name: Verify UTF-8 launchers and real BAT headers
        run: '& tests/Encoding.Tests.ps1'
      - name: Verify raster font fallback in a disposable console
        run: '& tests/ConsoleFont.Tests.ps1'
